<title>Ratio Masse Salariale</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ------------------------------------------------------------------ *
 * Jetons. Le bleu d'accent est le bleu de détection alimentaire — la
 * seule couleur qui n'existe pas dans un produit et qu'on impose donc
 * aux gants et aux outils en agroalimentaire. Les gris tirent vers le
 * vert-cyan de l'inox.
 * ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --ground:      #eef1f0;
  --surface:     #ffffff;
  --surface-2:   #f6f8f8;
  --surface-3:   #e8edec;
  --line:        #d5dcda;
  --line-strong: #b9c3c1;
  --ink:         #101715;
  --ink-2:       #4e5a58;
  --ink-3:       #7d8a88;
  --accent:      #0b49c4;
  --accent-soft: #e3ebfb;
  --good:        #1a7346;
  --good-soft:   #e0f0e7;
  --warn:        #94620a;
  --warn-soft:   #f8eed6;
  --crit:        #b0322a;
  --crit-soft:   #fae4e1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --shadow: 0 1px 2px rgba(16,23,21,.06), 0 8px 24px -12px rgba(16,23,21,.18);
  --r: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #0d1211;
    --surface:     #151b1a;
    --surface-2:   #1b2221;
    --surface-3:   #222b29;
    --line:        #2c3634;
    --line-strong: #3d4947;
    --ink:         #e9efed;
    --ink-2:       #a3b0ad;
    --ink-3:       #778481;
    --accent:      #6e9bf5;
    --accent-soft: #17264a;
    --good:        #5fc48d;
    --good-soft:   #12291e;
    --warn:        #e0aa4a;
    --warn-soft:   #2b2210;
    --crit:        #f08a7f;
    --crit-soft:   #2e1614;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s4: #c98500; --s5: #d55181; --s6: #008300;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #0d1211;
  --surface:     #151b1a;
  --surface-2:   #1b2221;
  --surface-3:   #222b29;
  --line:        #2c3634;
  --line-strong: #3d4947;
  --ink:         #e9efed;
  --ink-2:       #a3b0ad;
  --ink-3:       #778481;
  --accent:      #6e9bf5;
  --accent-soft: #17264a;
  --good:        #5fc48d;
  --good-soft:   #12291e;
  --warn:        #e0aa4a;
  --warn-soft:   #2b2210;
  --crit:        #f08a7f;
  --crit-soft:   #2e1614;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --s4: #c98500; --s5: #d55181; --s6: #008300;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/1.5 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display { font-family: "Archivo", system-ui, sans-serif; font-weight: 600; }
.num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.lbl {
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- Structure ---- */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 0 56px; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1240px; margin: 0 auto; padding: 12px 20px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
.brand .sub { font-size: 11.5px; color: var(--ink-3); }

.mois { display: flex; align-items: center; gap: 2px; }
.mois button {
  width: 30px; height: 30px; border: 1px solid var(--line);
  background: var(--surface); border-radius: var(--r); cursor: pointer; line-height: 1;
}
.mois button:hover { border-color: var(--line-strong); }
.mois .cur {
  min-width: 132px; text-align: center; padding: 0 10px; height: 30px;
  line-height: 28px; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r); font-weight: 600; font-size: 13px;
}

.tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabs button {
  padding: 6px 13px; border: 0; background: var(--surface); cursor: pointer;
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  border-right: 1px solid var(--line);
}
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }

.banner {
  margin-top: 16px; padding: 10px 14px; border-radius: var(--r);
  background: var(--warn-soft); color: var(--warn);
  border-left: 3px solid var(--warn); font-size: 13px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.banner button { margin-left: auto; }

/* ---- Bandeau consolidé : le seul bloc en relief de la page ---- */
.hero {
  margin-top: 18px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  display: grid; grid-template-columns: minmax(280px, 1.15fr) 1fr; gap: 0;
}
.hero-main { padding: 22px 24px; border-right: 1px solid var(--line); }
.hero-ratio { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
.hero-ratio .v {
  font-family: "Archivo", sans-serif; font-weight: 700; font-size: 58px;
  line-height: .9; letter-spacing: -.035em; font-variant-numeric: tabular-nums;
}
.hero-ratio .u { font-size: 21px; font-weight: 600; color: var(--ink-2); padding-bottom: 5px; }
.delta {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
  border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 7px;
}
.delta.good { background: var(--good-soft); color: var(--good); }
.delta.warn { background: var(--warn-soft); color: var(--warn); }
.delta.crit { background: var(--crit-soft); color: var(--crit); }

.gauge { margin-top: 18px; }
.gauge-track {
  position: relative; height: 8px; border-radius: 999px;
  background: var(--surface-3); overflow: visible;
}
.gauge-fill { height: 8px; border-radius: 999px; transition: width .3s ease; }
.gauge-mark {
  position: absolute; top: -5px; width: 2px; height: 18px;
  background: var(--ink); border-radius: 1px;
}
.gauge-legend {
  display: flex; justify-content: space-between; margin-top: 7px;
  font-size: 11.5px; color: var(--ink-3);
}

.hero-side { display: grid; grid-template-columns: 1fr 1fr; }
.stat { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.stat:nth-child(odd) { border-right: 1px solid var(--line); }
.stat:nth-last-child(-n+2) { border-bottom: 0; }
.stat .v { font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 500; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* ---- Panneaux ---- */
.panel {
  margin-top: 18px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r);
}
.panel > header {
  padding: 13px 18px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.panel > header h2 { font-size: 13.5px; margin: 0; }
.panel > header .spacer { margin-left: auto; }
.panel-body { padding: 18px; }

/* ---- Tableaux ---- */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); padding: 9px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }
.r { text-align: right; }
td.r, th.r { font-variant-numeric: tabular-nums; }
.stripe { width: 3px; padding: 0 !important; }
.stripe div { width: 3px; height: 34px; border-radius: 2px; }
.stripe.good div { background: var(--good); }
.stripe.warn div { background: var(--warn); }
.stripe.crit div { background: var(--crit); }
.stripe.none div { background: var(--line-strong); }
.site-nom { font-weight: 600; }
.site-meta { font-size: 11.5px; color: var(--ink-3); }
.pill {
  display: inline-block; padding: 2px 7px; border-radius: var(--r);
  font-size: 11px; font-weight: 600;
}
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.none { background: var(--surface-3); color: var(--ink-3); }
.pill.cdd { background: var(--accent-soft); color: var(--accent); }
.pill.cdi { background: var(--surface-3); color: var(--ink-2); }

/* ---- Contrôles ---- */
.btn {
  padding: 6px 12px; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r); cursor: pointer; font-size: 12.5px; font-weight: 500;
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 35%, var(--line)); }
.btn.mini { padding: 3px 8px; font-size: 11.5px; }

input[type="text"], input[type="number"], input[type="date"], select {
  padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); min-width: 0; max-width: 100%;
}
input.num-in {
  font-family: "IBM Plex Mono", monospace; text-align: right;
  width: 74px; font-variant-numeric: tabular-nums;
}
input.num-in.filled { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 11px; color: var(--ink-3); font-weight: 500; }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---- Graphique ---- */
.chart-wrap { position: relative; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; z-index: 10;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 9px 11px;
  font-size: 12px; min-width: 150px;
}
.tip .d { font-weight: 600; margin-bottom: 6px; font-size: 11.5px; }
.tip .l { display: flex; align-items: center; gap: 7px; justify-content: space-between; margin-top: 3px; }
.tip .l span:first-child { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; }
.legend > span { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }

.empty { padding: 34px 18px; text-align: center; color: var(--ink-3); font-size: 13px; }
.jour-ferie { color: var(--crit); font-weight: 600; }
.jour-dim { color: var(--accent); }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .hero-main { border-right: 0; border-bottom: 1px solid var(--line); }
  .hero-ratio .v { font-size: 46px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Ratio Masse Salariale</h1>
      <span class="sub">Propreté agroalimentaire</span>
    </div>
    <div class="mois">
      <button id="mois-prec" type="button" aria-label="Mois précédent">&#8249;</button>
      <div class="cur num" id="mois-cur">—</div>
      <button id="mois-suiv" type="button" aria-label="Mois suivant">&#8250;</button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-vue="pilotage" aria-selected="true">Pilotage</button>
      <button type="button" role="tab" data-vue="pointage" aria-selected="false">Pointage</button>
      <button type="button" role="tab" data-vue="effectif" aria-selected="false">Effectif</button>
      <button type="button" role="tab" data-vue="parametres" aria-selected="false">Paramètres</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="banner" hidden></div>
  <main id="vues"></main>
</div>

<script src="calc.js"></script>
<script src="app.js"></script>
